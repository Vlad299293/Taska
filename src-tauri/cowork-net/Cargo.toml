[package]
name = "cowork-net"
version = "0.1.0"
description = "Сеть для режима cowork: WebSocket-сервер хоста и поиск хостов в локальной сети"
edition = "2024"
rust-version = "1.90"

[dependencies]
futures-util = "0.3.34"
if-addrs = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = "0.30.0"
